name: Site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run export:pdf
        if: matrix.node == 24
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: customer-review-ontology-pdf
          path: build/customer-review-ontology.pdf

      - name: Detect Cloudflare credentials
        if: matrix.node == 24
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish pull-request preview
        if: matrix.node == 24 && github.event_name == 'pull_request' && steps.cloudflare.outputs.available == 'true'
        id: preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}

      - name: Add preview URL to pull request
        if: matrix.node == 24 && github.event_name == 'pull_request' && steps.preview.outcome == 'success'
        uses: actions/github-script@v7
        env:
          WRANGLER_OUTPUT: ${{ steps.preview.outputs.command-output }}
        with:
          script: |
            const marker = '<!-- customer-review-ontology-worker-preview -->'
            const match = process.env.WRANGLER_OUTPUT.match(/https:\/\/[^\s]+\.workers\.dev\/?/)
            if (!match) {
              core.warning('Wrangler did not return a preview URL to comment on the pull request.')
              return
            }
            const body = `${marker}\nCloudflare preview: ${match[0]}\n\n- Demo: ${match[0]}\n- Slides: ${match[0].replace(/\/$/, '')}/slides/`
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const previous = comments.find(comment => comment.body?.includes(marker))
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

      - name: Deploy production
        if: matrix.node == 24 && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
